# Tool configuration only. The project is deployed as a container image built
# from requirements.txt, not distributed as a package, so there is no
# [project] table or build backend here.

[tool.ruff]
target-version = "py311"  # matches the python:3.11-slim runtime image
line-length = 88

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear (likely bugs),
# UP: pyupgrade (idioms for the target version), S: bandit (security),
# ASYNC: blocking calls in async code, SIM: simplifications.
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "SIM"]

[tool.ruff.lint.per-file-ignores]
# pytest's assertion rewriting is the point of using bare asserts in tests.
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Promote warnings raised by our own code to errors so deprecations surface
# in CI rather than in production logs. Third-party warnings stay visible
# but do not fail the run.
filterwarnings = [
    "error:::app",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Set a few points below the current figure (~95%) so routine changes do not
# fail CI, while a change that lands untested request-path code does.
fail_under = 90
