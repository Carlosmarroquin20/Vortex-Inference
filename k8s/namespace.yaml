---
# Dedicated namespace provides hard isolation boundaries for:
#   - RBAC scope: ServiceAccount permissions are namespace-scoped by default
#   - NetworkPolicy enforcement: cross-namespace traffic requires explicit Allow rules
#   - ResourceQuota: aggregate limits prevent one workload from starving others
#   - LimitRange: sets default requests/limits for pods that omit them (defense-in-depth)
#
# In a production multi-tenant cluster, this namespace would correspond to one
# team or service boundary, each with its own KEDA ScaledObjects and Prometheus
# scrape configurations.
apiVersion: v1
kind: Namespace
metadata:
  name: vortex-inference
  labels:
    app.kubernetes.io/part-of: vortex-inference
    # Pod Security Standards label — "restricted" enforces non-root, no privilege
    # escalation, and seccomp profiles at the namespace level without per-pod spec.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest

---
# ResourceQuota caps aggregate resource consumption for the namespace.
#
# Sizing: the quota must admit KEDA's maxReplicaCount (3) plus the single
# rolling-update surge pod (maxSurge=1), i.e. 4 inference pods at once.
# Per pod: requests 2 CPU / 2Gi, limits 3.5 CPU / 4Gi.
#   requests.cpu    4 × 2    = 8
#   requests.memory 4 × 2Gi  = 8Gi
#   limits.cpu      4 × 3.5  = 14
#   limits.memory   4 × 4Gi  = 16Gi
# A tighter quota fails silently from KEDA's point of view: the HPA raises
# spec.replicas, the ReplicaSet controller gets "exceeded quota", and no
# pod is ever created. Actual placement is still bounded by node capacity;
# the quota only guards against runaway consumption inside the namespace.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: vortex-inference-quota
  namespace: vortex-inference
spec:
  hard:
    requests.memory: "8Gi"
    limits.memory: "16Gi"
    requests.cpu: "8"
    limits.cpu: "14"
    pods: "6"  # 4 inference pods at peak rollout, plus room for debug pods

---
# LimitRange sets defaults for any pod spec that omits resource fields.
# This prevents unbounded resource consumption from misconfigured workloads
# sharing the namespace and ensures Kubernetes can bin-pack pods correctly.
apiVersion: v1
kind: LimitRange
metadata:
  name: vortex-inference-limits
  namespace: vortex-inference
spec:
  limits:
  - type: Container
    default:
      memory: "512Mi"
      cpu: "500m"
    defaultRequest:
      memory: "256Mi"
      cpu: "100m"
    max:
      memory: "4Gi"
      cpu: "4"
