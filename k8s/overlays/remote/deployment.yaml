# Pod changes for remote backends. Merged into k8s/base/deployment.yaml, so
# everything not listed here (security context, probes' endpoints, rollout
# strategy, anti-affinity) is inherited unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vortex-inference
  namespace: vortex-inference
spec:
  template:
    spec:
      containers:
      - name: inference-server
        # Credential for the upstream API, kept in its own Secret so it can be
        # rotated without touching the key clients use for this server.
        # optional=false: without it every request would fail upstream, so a
        # missing Secret should block the rollout instead.
        env:
        - name: VORTEX_REMOTE_API_KEY
          valueFrom:
            secretKeyRef:
              name: vortex-inference-provider-key
              key: api-key
              optional: false

        # The process holds no model: the Python runtime, the HTTP clients and
        # in-flight request buffers. Measured on minikube at 53Mi idle, so the
        # request leaves room for concurrent requests and the limit for bursts;
        # the CPU limit covers TLS and JSON work under load.
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1"

        # There is no model to load, so readiness is checked from the start.
        # Measured on minikube: ready 6s after creation on a settled node, but
        # close to 60s while the node was starting the monitoring stack at the
        # same time, mostly in Python imports throttled by the CPU limit. The
        # budget allows twice that before the kubelet restarts the container.
        startupProbe:
          initialDelaySeconds: 2
          periodSeconds: 2
          failureThreshold: 60  # 120s total startup budget

        volumeMounts:
        - mountPath: /models
          $patch: delete

      volumes:
      - name: model-storage
        $patch: delete
