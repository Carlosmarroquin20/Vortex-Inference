# Prod: receives only images that staging ran healthy. The release workflow
# writes the tag and digest staging verified into the image below; nothing
# else changes it (ADR 0002).
#
# Differences from staging: three replicas minimum instead of one, and a
# disruption budget that keeps two of them serving through a drain.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vortex-prod

resources:
- ../../base
- sealed-secrets.yaml

components:
- ../../components/gitops-environment

labels:
- pairs:
    vortex.io/environment: prod

patches:
- path: keda-autoscaler.yaml
- path: pdb.yaml

images:
- digest: sha256:5a67528d6e2795d9087aa40e29048a58fbc13f8c039149128c02a171b802aa3d
  name: vortex-inference
  newName: ghcr.io/carlosmarroquin20/vortex-inference
  newTag: sha-c56a17a
