# Credentials of the prod environment, encrypted to the certificate in
# gitops/sealed-secrets/. Only the Sealed Secrets controller holding the
# matching private key can decrypt them, and each value only into the
# Secret and namespace named here. Regenerate with:
#   python scripts/seal_secrets.py environment prod
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: vortex-inference-api-key
  namespace: vortex-prod
spec:
  encryptedData:
    api-key: 
  template:
    metadata:
      name: vortex-inference-api-key
      namespace: vortex-prod
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: vortex-inference-jobs
  namespace: vortex-prod
spec:
  encryptedData:
    rabbitmq-management-url: 
    rabbitmq-password: 
    rabbitmq-url: 
    rabbitmq-username: 
    redis-auth.conf: 
    redis-password: 
    redis-url: 
  template:
    metadata:
      name: vortex-inference-jobs
      namespace: vortex-prod
    type: Opaque
