# Staging: the first environment every image on main reaches. The release
# workflow updates the image below with `kustomize edit set image` and
# commits it; Argo CD applies the commit. Promotion to prod copies the same
# tag and digest into ../prod once staging is healthy (ADR 0002).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vortex-staging

resources:
- ../../base
- sealed-secrets.yaml

components:
- ../../components/gitops-environment

labels:
- pairs:
    vortex.io/environment: staging

patches:
- path: keda-autoscaler.yaml

images:
- digest: sha256:a0d77a7fdf93d09823fd4ef490242a6e8e3f1a33bb573329c265b8815b0e1a05
  name: vortex-inference
  newName: ghcr.io/carlosmarroquin20/vortex-inference
  newTag: sha-6ed4b9c
