apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # Poll git every minute instead of every three. There is no webhook from
  # GitHub into these clusters, so polling is how a commit is noticed.
  timeout.reconciliation: 60s

  # Argo CD stopped assessing the health of Application resources in 1.8, so
  # by default the root app treats a child app as healthy the moment it
  # exists, and sync waves between child apps order nothing. With this check
  # the root app waits for each wave (controllers and CRDs, then cluster
  # objects, then the environments) to be healthy before starting the next.
  # This is the check from the Argo CD documentation.
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
