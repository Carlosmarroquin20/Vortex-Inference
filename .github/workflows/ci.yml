name: CI

# Trigger on every push and PR to main.
# Rationale: catching broken Dockerfiles or invalid k8s manifests before merge
# is cheaper than a failed deployment to a shared environment. These checks
# are intentionally lightweight — no cluster is provisioned, no model is
# downloaded. The goal is fast feedback (< 3 minutes) on structural validity.
#
# Runners are pinned to ubuntu-24.04 rather than ubuntu-latest: the latest
# label moves to new Ubuntu releases on GitHub's schedule, changing
# preinstalled tool versions underneath the pipeline without a commit here.
# Each job carries a timeout so a hung step fails fast instead of holding a
# runner for the 6-hour default.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run with no code change: new CVEs are published against
  # dependencies and base image packages that have not changed here, and
  # the dependency audit and image scan only catch them if they run.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege for the automatic GITHUB_TOKEN. No job pushes, comments or
# publishes, so read access to the repository is all any of them needs.
# Jobs that later require more must request it explicitly at job level.
permissions:
  contents: read

# A newer push to the same pull request supersedes the running checks.
# Pushes to main are never cancelled so every merged commit gets a verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Python linting
  # Validates code style and catches obvious errors without running the model.
  # ruff is chosen over flake8/pylint for its speed (~100x faster) and its
  # ability to replace isort, pyupgrade, and flake8 in a single binary.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install ruff
        # The version is read from requirements-dev.txt so local runs and CI
        # cannot drift apart; rule selection lives in pyproject.toml.
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: Run ruff check
        run: ruff check . --output-format=github

      - name: Run ruff format check
        # Fails if any file would be reformatted — enforces consistent style
        # without auto-applying changes in CI (that belongs in pre-commit).
        run: ruff format . --check

  # ---------------------------------------------------------------------------
  # Job 2: Unit and integration tests
  # Runs the pytest suite against an in-process fake of llama_cpp, so no model
  # weights or native build are needed. Coverage below the floor configured
  # in pyproject.toml fails the job.
  # ---------------------------------------------------------------------------
  test:
    name: Test Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # llama-cpp-python is excluded: tests/conftest.py replaces it with a
        # fake, and building it from source would add ~5 minutes for code the
        # suite never executes. The image build job covers the native library.
        run: |
          grep -v '^llama-cpp-python' requirements.txt > "${RUNNER_TEMP}/requirements-test.txt"
          pip install -r "${RUNNER_TEMP}/requirements-test.txt" -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov --cov-report=term-missing

  # ---------------------------------------------------------------------------
  # Job 3: Dependency vulnerability audit
  # pip-audit checks every pinned package, and everything it pulls in,
  # against the PyPI advisory database. Any known vulnerability fails the job.
  # ---------------------------------------------------------------------------
  audit:
    name: Audit Python Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install "$(grep -E '^pip-audit==' requirements-dev.txt)"

      - name: Audit runtime dependencies (transitive)
        # Resolves the full dependency tree. llama-cpp-python is excluded here
        # because resolving it means compiling it from source; the next step
        # audits its pinned version directly.
        run: |
          grep -v '^llama-cpp-python' requirements.txt > "${RUNNER_TEMP}/requirements-audit.txt"
          pip-audit --strict --progress-spinner off -r "${RUNNER_TEMP}/requirements-audit.txt"

      - name: Audit direct pins (including llama-cpp-python)
        run: |
          pip-audit --strict --progress-spinner off --no-deps --disable-pip -r requirements.txt
          pip-audit --strict --progress-spinner off --no-deps --disable-pip -r requirements-dev.txt

  # ---------------------------------------------------------------------------
  # Job 4: Dockerfile and shell script linting
  # Both linters run from images pinned by digest, so findings do not change
  # when the runner image updates its own copies of the tools.
  # ---------------------------------------------------------------------------
  lint-infra:
    name: Lint Dockerfile and Scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: hadolint
        run: |
          docker run --rm -i \
            hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            < docker/Dockerfile

      - name: shellcheck
        run: |
          docker run --rm -v "${PWD}:/mnt:ro" -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            scripts/*.sh

  # ---------------------------------------------------------------------------
  # Job 5: Docker build and image scan
  # Validates the multi-stage Dockerfile compiles successfully.
  # llama-cpp-python compilation (~5–8 min) is the most common failure point
  # when system library versions or CMake flags change.
  # The built image is NOT pushed. It is loaded into the runner's daemon so
  # Trivy can scan exactly what was built, OS packages and Python packages.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: vortex-inference:ci-${{ github.sha }}
          # Cache layers between runs to avoid recompiling llama-cpp-python
          # on every push. Cache hits reduce this job from ~8min to ~30s.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (Trivy)
        # Fails on HIGH or CRITICAL findings that have a fix available.
        # Unfixed findings are reported by upstream with no remediation path,
        # so gating on them would block every build without making the image
        # safer. The weekly scheduled run picks up newly published CVEs.
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress \
            "vortex-inference:ci-${{ github.sha }}"

  # ---------------------------------------------------------------------------
  # Job 6: Kubernetes manifest validation
  # Validates YAML structure and Kubernetes API schema without a live cluster.
  # kubeconform checks manifests against the published OpenAPI JSON schemas,
  # catching field typos, missing required fields, and API version mismatches
  # before they reach the cluster.
  #
  # kubectl --dry-run=client is deliberately not used: even in client mode it
  # performs API discovery against a server to resolve resource mappings, so
  # it fails with "connection refused" on a runner with no cluster.
  #
  # Each deployment profile is rendered with kustomize and the output is what
  # gets validated, so a patch in an overlay that breaks a field, or that no
  # longer matches its target in the base, fails here rather than at apply.
  #
  # Note: KEDA and prometheus-operator CRDs are not part of the core schema
  # set, so those kinds are skipped by kubeconform and checked for basic
  # structure with yq instead.
  # ---------------------------------------------------------------------------
  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kubeconform
        # The archive is verified against the SHA-256 published in the
        # release's CHECKSUMS file before anything is extracted onto PATH.
        env:
          KUBECONFORM_VERSION: v0.6.7
          KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
        run: |
          archive="${RUNNER_TEMP}/kubeconform.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum --check --strict
          sudo tar -xzf "${archive}" -C /usr/local/bin kubeconform

      - name: Install kustomize
        # Standalone and pinned rather than the runner's kubectl, whose
        # version changes with runner image updates. v5.7.1 is the version
        # embedded in kubectl 1.35, which `make deploy` uses.
        env:
          KUSTOMIZE_VERSION: v5.7.1
          KUSTOMIZE_SHA256: ea375e7372f9aa029129d4b2d16c66b7750b7f1213c4f66f910d981c895818d8
        run: |
          archive="${RUNNER_TEMP}/kustomize.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  ${archive}" | sha256sum --check --strict
          sudo tar -xzf "${archive}" -C /usr/local/bin kustomize

      # yq ships with the ubuntu-24.04 runner image, so it is not downloaded
      # here; the pinned runner version keeps it stable.

      - name: Render deployment profiles
        run: |
          mkdir -p "${RUNNER_TEMP}/rendered"
          kustomize build k8s/base > "${RUNNER_TEMP}/rendered/local.yaml"
          kustomize build k8s/overlays/remote > "${RUNNER_TEMP}/rendered/remote.yaml"

      - name: Validate core manifests (kubeconform)
        # Fully offline with respect to the cluster: schemas are fetched from
        # the public kubernetes-json-schema repository, pinned to the same
        # Kubernetes version the deployment targets.
        # -strict rejects unknown and duplicated fields, which is where most
        # indentation and typo mistakes surface.
        run: |
          kubeconform -strict -summary -kubernetes-version 1.35.9 \
            -skip ScaledObject,ServiceMonitor,PrometheusRule \
            "${RUNNER_TEMP}/rendered/local.yaml" \
            "${RUNNER_TEMP}/rendered/remote.yaml"

      - name: Validate CRD-based manifests (structure via yq)
        # Resources using third-party API groups (keda.sh, monitoring.coreos.com)
        # have no published schema here. Each must still be a complete object
        # with the four required top-level fields, and each profile must
        # contain all three, which catches a patch or resource list that
        # dropped one.
        run: |
          for profile in local remote; do
            rendered="${RUNNER_TEMP}/rendered/${profile}.yaml"
            for kind in ScaledObject ServiceMonitor PrometheusRule; do
              count=$(yq eval-all "[select(.kind == \"${kind}\" and has(\"apiVersion\") and has(\"metadata\") and has(\"spec\"))] | length" "${rendered}")
              if [ "${count}" != "1" ]; then
                echo "Profile ${profile}: expected one complete ${kind}, found ${count}"
                exit 1
              fi
            done
            echo "Profile ${profile}: CRD-based resources present and well-formed"
          done

      - name: Install promtool
        # Verified like kubeconform above; only promtool is extracted from the
        # Prometheus release archive.
        env:
          PROMETHEUS_VERSION: 3.15.0
          PROMETHEUS_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
        run: |
          archive="${RUNNER_TEMP}/prometheus.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  ${archive}" | sha256sum --check --strict
          sudo tar -xzf "${archive}" -C /usr/local/bin --strip-components=1 \
            "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"

      - name: Check and unit-test alerting rules (promtool)
        # The structure check above cannot see PromQL. promtool parses every
        # expression and template and runs the alert unit tests, which pin
        # thresholds, hold durations and annotations. promtool reads plain
        # rule files, and the PrometheusRule spec is one.
        run: |
          yq '.spec' k8s/base/monitoring/prometheus-rules.yaml > tests/monitoring/rendered-rules.yaml
          promtool check rules tests/monitoring/rendered-rules.yaml
          promtool test rules tests/monitoring/prometheus-rules.test.yaml

      - name: Validate Grafana dashboard JSON
        run: |
          jq -e '.panels | length > 0' k8s/base/monitoring/grafana-dashboard.json > /dev/null

      - name: Check for hardcoded secrets
        # Rudimentary secret scan: fails if any manifest contains patterns
        # that suggest a committed credential. Not a substitute for a proper
        # secret scanner (truffleHog, gitleaks) but catches obvious mistakes.
        run: |
          if grep -rE \
            "(password|secret|token|api_key)\s*[:=]\s*['\"]?[A-Za-z0-9+/]{16,}" \
            k8s/ --include="*.yaml"; then
            echo "Potential hardcoded secret detected in k8s manifests."
            exit 1
          fi
          echo "No hardcoded secrets detected."
