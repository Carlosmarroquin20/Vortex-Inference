# Every dependency in this repository is pinned exactly: Python packages by
# version, the base image by digest, and GitHub Actions by commit SHA. Pins
# make builds reproducible but go stale silently; Dependabot turns each
# upstream release into a pull request that runs the full CI, including the
# dependency audit and the image scan.
#
# cooldown delays proposals for a week after a release. Most malicious
# package releases are detected and yanked within days, and a short wait
# also skips the broken releases that are typically followed by a quick
# patch.
version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Routine minor and patch updates arrive as one pull request.
      # llama-cpp-python is excluded so every bump of the native inference
      # engine is reviewed on its own: its releases track llama.cpp, which
      # changes build flags and the GGUF loader between minor versions.
      python-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["llama-cpp-python"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(docker)"
    # Only digest refreshes of the current Python line (security rebuilds of
    # 3.11-slim-trixie). Dependabot reads the Python version in the tag as
    # semver, so 3.11 -> 3.14 arrives as a "minor" update. Moving Python
    # versions changes the interpreter ABI that the compiled llama.cpp wheel
    # targets, and is a deliberate migration, not a routine bump.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # RabbitMQ and Redis for the integration tests. Major versions are left to
  # a deliberate upgrade: RabbitMQ 4, for one, stopped counting requeues
  # towards a quorum queue's delivery limit, which the worker depends on.
  - package-ecosystem: docker-compose
    directory: /tests/integration
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "test(deps)"
    groups:
      integration-services:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
